<h2>Available Graphs</h2>

<select id="graphSelector" style="padding:8px; font-size:16px;">
  <option>Loading graphs...</option>
</select>

<iframe id="graphFrame"
        width="100%"
        height="800"
        style="border:none; margin-top:20px;">
</iframe>

<script>
async function loadGraphList() {
  const apiUrl = "https://mvmckalklogthnnzvjhm.supabase.co/storage/v1/object/list/codeval.ai/repos/TheAlgorithms";

  const response = await fetch(apiUrl);
  const files = await response.json();

  const dropdown = document.getElementById("graphSelector");
  dropdown.innerHTML = ""; // clear loading text

  files
    .filter(f => f.name.endsWith(".html"))
    .forEach(file => {
      const option = document.createElement("option");
      option.value = file.name;
      option.textContent = file.name;
      dropdown.appendChild(option);
    });

  // Load first file automatically
  if (files.length > 0) {
    loadGraph(files[0].name);
  }
}

function loadGraph(filename) {
  const url = `https://mvmckalklogthnnzvjhm.supabase.co/storage/v1/object/public/codeval.ai/repos/TheAlgorithms/${filename}`;
  document.getElementById("graphFrame").src = url;
}

document.getElementById("graphSelector").addEventListener("change", (e) => {
  loadGraph(e.target.value);
});

// Load list on page load
loadGraphList();
</script>
