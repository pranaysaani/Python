<h2>Available Graphs</h2>

<select id="graphSelector" style="padding:8px; font-size:16px;">
</select>

<iframe id="graphFrame"
        width="100%"
        height="800"
        style="border:1px solid #d0d7de; margin-top:20px;">
</iframe>

<script>
// Just list your known graph URLs here:
const graphFiles = [
  {
    name: "Combined Navigatable Callgraph",
    url: "https://mvmckalklogthnnzvjhm.supabase.co/storage/v1/object/public/codeval.ai/repos/TheAlgorithms/Python/16d30b1163914155a798fadce7b4f3fd/combined_callgraph/combined_navigatable_callgraph.html"
  },
  {
    name: "Volume Flow Graph",
    url: "https://mvmckalklogthnnzvjhm.supabase.co/storage/v1/object/public/codeval.ai/repos/TheAlgorithms/Python/16d30b1163914155a798fadce7b4f3fd/flowgraphs/math_volume_main_flow_graph.html"
  }
  // Add more here...
];

function loadDropdown() {
  const dropdown = document.getElementById("graphSelector");

  graphFiles.forEach(file => {
    const option = document.createElement("option");
    option.value = file.url;
    option.textContent = file.name;
    dropdown.appendChild(option);
  });

  // Load the first graph automatically
  if (graphFiles.length > 0) {
    loadGraph(graphFiles[0].url);
  }
}

function loadGraph(url) {
  document.getElementById("graphFrame").src = url;
}

document.getElementById("graphSelector").addEventListener("change", e => {
  loadGraph(e.target.value);
});

loadDropdown();
</script>
