<h2>📜 Available Graphs</h2>

<select id="graphSelector" style="padding:8px;font-size:16px;">
    <option>Loading graphs...</option>
</select>

<div style="
    border:1px solid #d0d7de;
    border-radius:8px;
    padding:15px;
    margin-top:20px;
">

    <h3 id="graphTitle">Algorithms → Math → Volume</h3>

    <iframe
        id="graphFrame"
        width="100%"
        height="800"
        style="border:none;">
    </iframe>

</div>

<script>
const PROJECT_URL = "https://mvmckalklogthnnzvjhm.supabase.co";
const BUCKET = "codeval.ai";
const ROOT_PREFIX = "repos/TheAlgorithms";

const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12bWNrYWxrbG9ndGhubnp2amhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MjY0NDEsImV4cCI6MjA5NTQwMjQ0MX0.cDWVrsarZeaMobEQIyZh4JbsW_TpQpwIJISbcz4mcYg";
async function listFolder(prefix) {

    const res = await fetch(
        `${PROJECT_URL}/storage/v1/object/list/${BUCKET}`,
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "apikey": ANON_KEY,
                "Authorization": `Bearer ${ANON_KEY}`
            },
            body: JSON.stringify({
                prefix: prefix,
                limit: 1000,
                offset: 0,
                sortBy: {
                    column: "name",
                    order: "asc"
                }
            })
        }
    );

    if (!res.ok) {
        const text = await res.text();
        console.error("Supabase Error:", text);
        return [];
    }

    const items = await res.json();

    console.log("Items:", items);

    if (!Array.isArray(items)) {
        console.error("Expected array:", items);
        return [];
    }

    let results = [];

    for (const item of items) {

        const fullPath = `${prefix}/${item.name}`;

        const isFolder =
            !item.metadata ||
            item.metadata === null;

        if (isFolder) {
            const sub = await listFolder(fullPath);
            results = results.concat(sub);
        }
        else if (
            fullPath.endsWith(".html")
        ) {
            results.push(fullPath);
        }
    }

    return results;
}

async function loadGraphList() {

    const files =
        await listFolder(ROOT_PREFIX);

    const dropdown =
        document.getElementById("graphSelector");

    dropdown.innerHTML = "";

    if (files.length === 0) {

        dropdown.innerHTML =
            "<option>No HTML graphs found</option>";

        return;
    }

    files.forEach(path => {

        const option =
            document.createElement("option");

        option.value = path;

        option.textContent =
            path.replace(
                ROOT_PREFIX + "/",
                ""
            );

        dropdown.appendChild(option);
    });

    loadGraph(files[0]);
}

function loadGraph(path) {

    const url =
        `${PROJECT_URL}/storage/v1/object/public/${BUCKET}/${path}`;

    document
        .getElementById("graphFrame")
        .src = url;

    document
        .getElementById("graphTitle")
        .textContent =
        path
          .replace(ROOT_PREFIX + "/", "")
          .replace(".html", "")
          .replaceAll("_", " → ");
}

document
    .getElementById("graphSelector")
    .addEventListener(
        "change",
        e => loadGraph(e.target.value)
    );

loadGraphList();

</script>
