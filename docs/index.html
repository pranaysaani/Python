<h2>Available Graphs</h2>

<select id="graphSelector" style="padding:8px; font-size:16px;">
  <option>Loading graphs...</option>
</select>

<iframe id="graphFrame"
        width="100%"
        height="800"
        style="border:none; margin-top:20px;">
</iframe>

<script>
const BASE = "https://mvmckalklogthnnzvjhm.supabase.co/storage/v1/object";
const PUBLIC = `${BASE}/public/codeval.ai/repos/TheAlgorithms`;
const LIST = `${BASE}/list/codeval.ai/repos/TheAlgorithms`;

async function listFolder(path = "") {
  const url = `${BASE}/list/codeval.ai/repos/TheAlgorithms${path}`;
  const res = await fetch(url);
  const items = await res.json();

  let results = [];

  for (const item of items) {
    if (item.name.endsWith(".html")) {
      results.push(path + "/" + item.name);
    }

    if (item.metadata && item.metadata.isDirectory) {
      const sub = await listFolder(path + "/" + item.name);
      results = results.concat(sub);
    }
  }

  return results;
}

async function loadGraphList() {
  const files = await listFolder("");

  const dropdown = document.getElementById("graphSelector");
  dropdown.innerHTML = "";

  files.forEach(file => {
    const option = document.createElement("option");
    option.value = file;
    option.textContent = file;
    dropdown.appendChild(option);
  });

  if (files.length > 0) {
    loadGraph(files[0]);
  }
}

function loadGraph(path) {
  const url = `${PUBLIC}${path}`;
  document.getElementById("graphFrame").src = url;
}

document.getElementById("graphSelector").addEventListener("change", (e) => {
  loadGraph(e.target.value);
});

loadGraphList();
</script>
